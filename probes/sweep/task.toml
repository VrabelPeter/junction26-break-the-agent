schema_version = "1.4"
artifacts = []

[task]
name = "junction/living-room-sweep"
version = "0.1.0"
description = "A wheeled two-arm robot sweeps the trash, and only the trash, from a living room into a bin, seeing the room through its cameras"
authors = []
keywords = ["robotics", "mujoco", "mobile manipulation", "vision"]

[metadata]

[verifier]
user = "root"
timeout_sec = 300.0
environment_mode = "shared"
collect = []

[verifier.env]

[agent]
# The agent runs unprivileged so it cannot tamper with what the verifier (root) uses.
user = "agent"
timeout_sec = 3600.0

[environment]
network_mode = "public"
build_timeout_sec = 2400.0
os = "linux"
cpus = 2
memory_mb = 4096

[[environment.mcp_servers]]
name = "robot"
transport = "streamable-http"
url = "http://env-server:8000/mcp"

[environment.env]

[solution.env]
