# Merged over Harbor's base compose file. `main` is the agent container.
services:
  main:
    depends_on:
      env-server:
        condition: service_healthy

  env-server:
    build:
      context: ./env-server
    environment:
      VISION_SEED: "${VISION_SEED:-1}"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',8000),timeout=2); s.close()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
